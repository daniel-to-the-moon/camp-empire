# T1 匿名统计的保留期清理（docs/ANALYTICS.md）：每天删除超过 RETENTION_DAYS（默认 180 天，提案值）的记录。
# 与发布解耦：站点不再发布、或统计已关闭（ANALYTICS 不是 on），已存的记录照样按期删除（Codex 审核 #66）。
# 只稀疏检出 main 的 scripts/devloop，不执行应用代码；逻辑在 scripts/devloop/d1-retention.sh（pages.test.mjs 覆盖）。
name: analytics-retention

on:
  schedule:
    - cron: '17 19 * * *' # 每天上海时间 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/devloop
          persist-credentials: false
      - name: 删除过期的匿名统计记录
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT || 'camp-empire' }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '180' }}
          ANALYTICS: ${{ vars.ANALYTICS }}
        run: bash scripts/devloop/d1-retention.sh
