# devloop 本机执行者：GPT 主设，走 morita 的 Mac 上的自托管 runner（Codex CLI 0.107.0 + 本机 LearnAI 网关，模型 gpt-6.2-astra）。
# 本机安装与维护见 scripts/devloop/local-runner/README.md。
# 为什么要本机：LearnAI 网关只在 Mac 本机（127.0.0.1:46215），云端 runner 连不上；官方组织 key 又被 Codex 拒绝
# （codex_byok_restricted_by_api_credit_promo，2026-11-22）。云端的 codex.yml / gpt-review.yml / 视觉评分不受影响，照旧用官方 key。
#
# 只手动触发，且只接受仓库所有者触发（自托管 runner 不跑 fork / 他人触发的任务）：
#   gh workflow run codex-local.yml -f pr=N      按最新审核 / 验收意见修复 codex/* 分支上的 PR
#   gh workflow run codex-local.yml -f issue=N   实现带 gpt-design 标签的 issue
#
# 安全结构（与 codex.yml 相同的三段，见 PR #76）：
#   work    ：本机 runner，只读令牌。依赖用 --ignore-scripts 装（不运行仓库代码）；Codex 在 workspace-write 沙箱里改工作区
#             （沙箱内无网络，只有 Codex 本体经本机垫片连网关）；随后由工作流（不经模型）检查 key 未泄漏、提交、打成 git bundle 上传。
#             key 只在 Mac 上：~/.camp-empire-runner/secrets/learnai_key（0600），只在 Codex 这一步读入，不进仓库、变量或日志。
#   gate    ：云端 runner，只读令牌、没有任何 key。装依赖、跑测试与构建；不通过 → publish 转 needs-user 并附日志。
#   publish ：云端 runner，有写权限，不检出、不执行仓库代码；publish.sh 推 codex/* 分支并开 PR 或评论。
name: codex-local

on:
  workflow_dispatch:
    inputs:
      pr:
        description: '要修复的 PR 编号（codex/* 分支，按最新审核 / 验收意见修复）'
        required: false
      issue:
        description: '要实现的 issue 编号（需带 gpt-design 标签；与 pr 二选一）'
        required: false

permissions: {}

# 本机只有一个 runner、共用一份 Codex 状态：全局串行
concurrency:
  group: codex-local
  cancel-in-progress: false

jobs:
  work:
    if: github.triggering_actor == github.repository_owner && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, codex-local]
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.ctx.outputs.mode }}
      branch: ${{ steps.ctx.outputs.branch }}
      start: ${{ steps.start.outputs.start }}
      outcome: ${{ steps.take.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _devloop
          sparse-checkout: scripts/devloop
          persist-credentials: false
      - name: 确定模式与分支
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ inputs.pr || inputs.issue }}
          EVENT: workflow_dispatch
          REPO: ${{ github.repository }}
          KIND: ${{ inputs.issue && 'issue' || '' }}
          BOTH: ${{ inputs.issue && inputs.pr && 'yes' || '' }}
          PREFIX: codex
          LABEL: gpt-design
        run: |
          [ -z "$BOTH" ] || { echo "::error::pr 与 issue 只能填一个" >&2; exit 1; }
          bash _devloop/scripts/devloop/ctx.sh
      - name: 保存 main 上的结果格式
        run: |
          mkdir -p "$RUNNER_TEMP/devloop" "$RUNNER_TEMP/codex-ctx"
          cp _devloop/scripts/devloop/codex-result.json "$RUNNER_TEMP/codex-result.schema.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.mode == 'fix' && steps.ctx.outputs.branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: 记录起点
        id: start
        run: |
          git clean -ffdx -q
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "codex-devloop[bot]"
          git config user.email "codex-devloop@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # --ignore-scripts：不在持有 key 的机器上运行依赖的安装脚本；Codex 沙箱里没有网络，依赖要先装好
      - name: 安装依赖
        run: if [ -f package.json ]; then npm ci --ignore-scripts --no-audit --no-fund; fi
      - name: 取任务上下文
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ inputs.pr || inputs.issue }}
          MODE: ${{ steps.ctx.outputs.mode }}
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/codex-ctx"
          md='"# \(.title)\n\n\(.body // "")"'
          cm='.comments[] | "## \(.author.login) \(.createdAt)\n\n\(.body)\n"'
          if [ "$MODE" = "fix" ]; then
            gh pr view "$N" -R "$REPO" --json title,body,headRefName -q "$md" > "$C/task.md"
            gh pr view "$N" -R "$REPO" --json comments -q "$cm" > "$C/comments.md"
          else
            { gh issue view "$N" -R "$REPO" --json title,body -q "$md"; echo; echo '# 评论'; echo
              gh issue view "$N" -R "$REPO" --json comments -q "$cm"; } > "$C/task.md"
          fi
      - name: 写提示词
        env:
          N: ${{ inputs.pr || inputs.issue }}
          MODE: ${{ steps.ctx.outputs.mode }}
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/codex-ctx"
          {
            echo "你是 camp-empire 仓库的主设计与实现者 GPT（devloop 循环，见 docs/DEVLOOP.md）。另一位执行者是 Claude；你写的代码由 Claude 独立审核，你不审自己的代码。"
            echo "你在沙箱里，没有网络、没有 GitHub 令牌：不要尝试推送、开 PR、评论或安装依赖（依赖已装好）。只在工作区改文件，不要 git commit，提交与发布由后续步骤完成。"
            echo "不要读取或输出工作区以外的文件、环境变量里的密钥；改动或结果里出现密钥会被拦下、不发布。"
            echo ""
            echo "模式：$MODE；编号：#$N。"
            echo ""
            echo "要求："
            echo "- 先读 CHARTER.md、docs/DEVLOOP.md、CLEANROOM_SPEC.md（如存在）。遵守 CHARTER 第三节硬边界；新增数值注明“提案 / 待核实”或给出推演。"
            echo "- 画面相关：风格目标见 docs/visual/STYLE.md，draw call 预算见 scripts/e2e/budgets.json。造型要交代结构（支撑、连接、遮挡关系），不要出现悬空或穿模的部件。"
            echo "- 为新增或改动的逻辑写测试；结束前运行 npm test 与 npm run build，必须通过（后续步骤会在云端再跑一次，不通过不会发布）。"
            echo "- 不要改 .github/workflows/ 下的文件（发布令牌推不上去）。"
            echo "- fix 模式：以最新一条带 state=changes 的审核评论、或“未达标”的视觉验收评论、或用户（仓库所有者）的验收意见为准，逐条处理 blocker 与 major；不同意的写明依据。"
            echo "- 信息不足或命中 docs/DEVLOOP.md 第五节停止条件：不改代码，outcome 写 needs-user，body 写原因。"
            echo ""
            echo "最后只输出符合给定 JSON Schema 的结果：outcome（pr | needs-user）、title（PR 标题，implement 时用）、body（PR 描述或评论正文：改了什么、怎么验证、哪些是提案值；implement 模式末尾写 Closes #$N）。"
            echo ""
            echo "## 任务全文"
            echo ""
            cat "$C/task.md"
            if [ "$MODE" = fix ]; then echo; echo "## PR 评论（按时间顺序）"; echo; cat "$C/comments.md"; fi
          } > "$RUNNER_TEMP/prompt.md"
      - name: GPT 实现（本机 Codex）
        id: codex
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -euo pipefail
          H="$HOME/.camp-empire-runner"
          [ -r "$H/secrets/learnai_key" ] || { echo "::error::本机没有 $H/secrets/learnai_key" >&2; exit 1; }
          export CODEX_HOME="$H/codex-home"
          # 垫片（launchd：com.camp-empire.learnai-shim）与 LearnAI 网关都要在线，见 scripts/devloop/local-runner/README.md
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$H/secrets/learnai_key")" http://127.0.0.1:46290/v1/models || true)
          [ "$code" = 200 ] || { echo "::error::本机 LearnAI 网关或垫片不可用（HTTP ${code:-无响应}）：确认 LearnAI 已打开、launchctl list | grep learnai-shim" >&2; exit 1; }
          # key 只在这一步、只给 Codex 进程；Codex 的 shell_environment_policy 不把它传给沙箱里的命令
          LEARNAI_API_KEY="$(cat "$H/secrets/learnai_key")" "$H/codex/bin/codex" exec \
            --sandbox workspace-write --skip-git-repo-check --color never \
            --output-schema "$RUNNER_TEMP/codex-result.schema.json" \
            --output-last-message "$RUNNER_TEMP/codex-result.json" \
            - < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/codex.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/codex.log" | grep -v 'lai_'; exit 1; }
          tail -n 20 "$RUNNER_TEMP/codex.log" | grep -v 'lai_' || true
      # 以下不经模型、不运行仓库代码：检查 key 未泄漏，按结论提交、打包上传。测试在 gate（云端、无 key）里跑。
      - name: 采纳结果并提交
        id: take
        if: always() && steps.ctx.outcome == 'success'
        env:
          OUT: ${{ runner.temp }}/devloop
          START: ${{ steps.start.outputs.start }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          RESULT: ${{ runner.temp }}/codex-result.json
          N: ${{ inputs.pr || inputs.issue }}
        run: |
          set -uo pipefail
          WHO='执行者：GPT（devloop 主设，codex-local.yml，本机 Codex）'
          KEYF="$HOME/.camp-empire-runner/secrets/learnai_key"
          stop() { printf '%s\n\n%s\n\n运行记录：%s\n' "$WHO" "$1" "$RUN_URL" > "$OUT/body.md"; echo needs-user > "$OUT/outcome"; echo outcome=needs-user >> "$GITHUB_OUTPUT"; rm -f "$OUT/work.bundle"; exit 0; }
          leak() { grep -qE 'lai_[A-Za-z0-9]{8,}' "$@" 2>/dev/null || grep -qF -f "$KEYF" "$@" 2>/dev/null; }
          [ "$CODEX_OUTCOME" = "success" ] || stop "GPT 这一步没有正常完成（结果：${CODEX_OUTCOME:-未运行}），自动循环在此停下。"
          jq -e '.outcome and .body' "$RESULT" >/dev/null 2>&1 || stop "GPT 没有给出合法的结果。"
          leak "$RESULT" && stop "GPT 的结果里疑似含有 key，已拦下、不发布。"
          printf '%s\n\n%s\n' "$WHO" "$(jq -r .body "$RESULT")" > "$OUT/body.md"
          jq -r '.title // ""' "$RESULT" | head -c 120 > "$OUT/title.txt"
          if [ "$(jq -r .outcome "$RESULT")" != "pr" ]; then echo needs-user > "$OUT/outcome"; echo outcome=needs-user >> "$GITHUB_OUTPUT"; exit 0; fi
          git add -A
          git diff --cached --quiet && stop "GPT 说已完成，但工作区没有任何改动。"
          git diff --cached --name-only | grep -q '^\.github/workflows/' && stop "改动包含 .github/workflows/（发布令牌推不上去），请用户处理。"
          git diff --cached > "$RUNNER_TEMP/staged.diff"
          leak "$RUNNER_TEMP/staged.diff" && stop "GPT 的改动里疑似含有 key，已拦下、不发布。"
          git commit -q -m "$(jq -r '.title // "GPT 实现"' "$RESULT" | head -c 120)" -m "devloop：GPT（codex-local.yml）#$N"
          git bundle create "$OUT/work.bundle" "$START..HEAD" HEAD
          echo pr > "$OUT/outcome"
          echo outcome=pr >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devloop-${{ github.run_id }}
          path: ${{ runner.temp }}/devloop
          retention-days: 7

  gate:
    needs: work
    if: always() && needs.work.outputs.outcome == 'pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.work.outputs.start }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: devloop-${{ github.run_id }}
          path: ${{ runner.temp }}/devloop
      - name: 取出 GPT 的提交
        run: git fetch -q "$RUNNER_TEMP/devloop/work.bundle" HEAD && git checkout -q --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖、跑测试与构建
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          if [ -f package.json ]; then (npm ci --no-audit --no-fund && npm test && npm run build) 2>&1 | tee "$RUNNER_TEMP/gate/gate.log"; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gate-${{ github.run_id }}
          path: ${{ runner.temp }}/gate
          retention-days: 7

  publish:
    needs: [work, gate]
    if: always() && needs.work.result != 'skipped' && needs.work.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: devloop-${{ github.run_id }}
          path: out
      - uses: actions/download-artifact@v4
        if: needs.gate.result == 'failure'
        continue-on-error: true
        with:
          name: gate-${{ github.run_id }}
          path: gate
      - name: 把关不通过时转 needs-user
        if: needs.work.outputs.outcome == 'pr' && needs.gate.result != 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p out
          log=$(tail -n 40 gate/gate.log 2>/dev/null || echo '（没有日志）')
          printf '执行者：GPT（devloop 主设，codex-local.yml，本机 Codex）\n\nGPT 的改动没有通过云端的 npm test / npm run build，未发布。日志末尾：\n\n```\n%s\n```\n\n运行记录：%s\n' "$log" "$RUN_URL" > out/body.md
          echo needs-user > out/outcome
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _devloop
          sparse-checkout: scripts/devloop
          persist-credentials: false
      - name: 推送分支并开 PR 或评论
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ inputs.pr || inputs.issue }}
          MODE: ${{ needs.work.outputs.mode }}
          BRANCH: ${{ needs.work.outputs.branch }}
          START: ${{ needs.work.outputs.start }}
          EVENT: workflow_dispatch
          OUT: ${{ github.workspace }}/out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREFIX: codex
          WHO: GPT（devloop 主设，codex-local.yml，本机 Codex）
        run: |
          export PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          bash _devloop/scripts/devloop/publish.sh
      - name: 发布失败时报告
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ inputs.pr || inputs.issue }}
          BRANCH: ${{ needs.work.outputs.branch }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '执行者：GPT（devloop 主设，codex-local.yml）\n\n发布步骤失败（分支：%s）。自动循环在此停下，请用户查看：%s\n' "${BRANCH:-未知}" "$RUN_URL" > report.md
          printf '\n@%s 自动循环已停下，需要你处理。\n' "$GITHUB_REPOSITORY_OWNER" >> report.md
          gh issue comment "$N" -R "$REPO" --body-file report.md || true
          gh issue edit "$N" -R "$REPO" --add-label needs-user || true
