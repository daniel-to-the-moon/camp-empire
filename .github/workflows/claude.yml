# devloop 云端执行者：Claude（docs/DEVLOOP.md）
# - issue 打上 devloop 标签 → Claude 实现并开 PR
# - GPT 审核评论“需修改 / 测试失败 / 冲突” → Claude 在同一 PR 分支上修复
# 审核与合并不在这里：由用户 Mac 上的 GPT 审核方（scripts/devloop/devloop.mjs watch）完成。
name: claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  implement:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'devloop' &&
      !contains(github.event.issue.labels.*.name, 'needs-user')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 配置 git 身份
        run: |
          git config user.name "claude-devloop[bot]"
          git config user.email "claude-devloop@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            你是 camp-empire 仓库的代码执行者 Claude（devloop 循环，见 docs/DEVLOOP.md）。
            仓库：${{ github.repository }}；任务：issue #${{ github.event.issue.number }}。

            1. 先读 CHARTER.md、docs/DEVLOOP.md，再用 `gh issue view ${{ github.event.issue.number }} --comments` 读 issue 全文。
            2. 如果命中 docs/DEVLOOP.md 第四节任一停止条件，或 issue 本身信息不足以动手：在 issue 下评论说明原因
               （开头写“执行者：Claude（devloop）”），执行 `gh issue edit ${{ github.event.issue.number }} --add-label needs-user`，然后结束，不写代码。
            3. 否则：从 main 新建分支 `claude/issue-${{ github.event.issue.number }}`，实现需求，并为新增或改动的逻辑写测试。
               遵守 CHARTER 第三节硬边界；新增数值注明“提案 / 待核实”或给出推演。
            4. 提交前必须本地通过：`npm ci --no-audit --no-fund && npm test && npm run build`。不通过就继续修，不要提交失败的代码。
            5. 推送分支并开 PR：`gh pr create --base main --head claude/issue-${{ github.event.issue.number }}`。
               PR 描述开头写“执行者：Claude（devloop）”，写明改了什么、怎么验证、哪些是提案值，末尾写 `Closes #${{ github.event.issue.number }}`。
            6. 不要合并、不要审核自己的 PR；合并由 GPT 审核方完成。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fix:
    # GPT 审核评论（由用户账号经 devloop 发出，开头固定为“执行者：GPT”）带 state=changes 标记时触发
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '执行者：GPT') &&
      contains(github.event.comment.body, '<!-- devloop state=changes ') &&
      !contains(github.event.issue.labels.*.name, 'needs-user') &&
      !contains(github.event.issue.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: claude-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: 取 PR 分支
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "ref=$(gh pr view ${{ github.event.issue.number }} -R ${{ github.repository }} --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 配置 git 身份
        run: |
          git config user.name "claude-devloop[bot]"
          git config user.email "claude-devloop@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            你是 camp-empire 仓库的代码执行者 Claude（devloop 循环，见 docs/DEVLOOP.md）。
            PR #${{ github.event.issue.number }}（分支 `${{ steps.pr.outputs.ref }}`，已检出）刚收到 GPT 审核方的评论，要求修改。

            1. 读 CHARTER.md、docs/DEVLOOP.md，用 `gh pr view ${{ github.event.issue.number }} --comments` 读 PR 描述和全部评论，以最新一条“执行者：GPT”评论为准。
            2. 逐条处理所有 blocker 与 major；minor 合理就改。不同意的意见在回复里给出理由（附代码或数据依据），不要静默忽略。
               如果评论说“测试或构建失败”，用评论里的 Actions 链接对应的运行号执行 `gh run view <运行号> --log-failed` 看失败日志，复现后再修；
               如果说“与基准分支冲突”，`git merge origin/main` 后解决冲突。
            3. 推送前必须通过：`npm ci --no-audit --no-fund && npm test && npm run build`（无 package.json 的纯文档 PR 跳过）。
            4. 推送到同一分支（不要强推，不要新开 PR），然后在 PR 下评论：开头写“执行者：Claude（devloop）”，逐条列出每个意见的处理结果。
            5. 不要合并；推送后 GPT 审核方会自动重新审核。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
