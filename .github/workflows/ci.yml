# 测试与构建。PR 代码只在 GitHub 托管的一次性 runner 上执行，不在用户机器上执行（GPT 审核 #6 的 blocker）。
# - workflow_dispatch：devloop 审核方触发。把 PR 头部提交合并到指定 main 提交上再测，
#   保证测试的就是“合并后的代码”；并核对 head / base 与审核方给的完全一致。
# - pull_request：人工推送的 PR（GITHUB_TOKEN 开的 PR 不会触发，靠上面的 dispatch）。
# - push main：测试 + 构建，并把 dist 上传为发布产物（Actions artifact）；再由 pages 任务发布到 Cloudflare Pages（见下）。
name: ci
run-name: ${{ github.event_name == 'workflow_dispatch' && format('devloop {0} PR#{1}', inputs.nonce, inputs.pr) || format('ci {0}', github.event_name) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr: { description: 'PR 编号', required: true }
      head: { description: '要测试的 PR 头部提交（完整 SHA）', required: true }
      base: { description: '要合并到的 main 提交（完整 SHA）', required: true }
      nonce: { description: '审核方用来找回本次运行的随机串', required: true }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base || '' }}
          fetch-depth: 0
          persist-credentials: false
      # 私有仓库拉 PR 头部需要认证：用第二个 checkout（同样不保留凭据）取到子目录，再从本地目录 fetch，
      # 这样后续执行 PR 代码的步骤里不存在任何令牌（GPT 审核 #6 第二轮 major）
      - name: 取 PR 头部（仅 devloop 触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          path: _devloop_pr
          fetch-depth: 0
          persist-credentials: false
      - name: 合并 PR 头部到指定 main（仅 devloop 触发）
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "::error::main 提交与预期不符"; exit 1; }
          test "$(git -C _devloop_pr rev-parse HEAD)" = "$HEAD_SHA" || { echo "::error::PR 头部已变化"; exit 1; }
          git fetch -q ./_devloop_pr "$HEAD_SHA"
          rm -rf _devloop_pr
          git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit "$HEAD_SHA" \
            || { echo "::error::与 main 冲突"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: devloop 脚本自测
        run: if [ -d scripts/devloop ]; then node --test scripts/devloop/*.test.mjs; else echo "无 devloop 脚本，跳过"; fi
      - name: 是否有应用代码
        id: app
        run: if [ -f package.json ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "无 package.json，跳过 npm 步骤"; fi
      - if: steps.app.outputs.yes == '1'
        run: npm ci --no-audit --no-fund
      - if: steps.app.outputs.yes == '1'
        run: npm test
      - if: steps.app.outputs.yes == '1'
        run: npm run build
      - name: 上传发布产物（main）
        if: github.event_name == 'push' && steps.app.outputs.yes == '1'
        uses: actions/upload-artifact@v4
        with:
          name: camp-empire-${{ github.sha }}
          path: dist
          retention-days: 90

  # 发布到 Cloudflare Pages（内部验收环境，用户 2026-11-07 选定）。只在 main 更新后运行。逻辑在 scripts/devloop/pages.sh（有测试）。
  # 不执行仓库里的应用代码：只稀疏检出 main 的 scripts/devloop，下载 test 任务构建好的 dist，用固定版本 wrangler 上传。凭据只在本任务。
  # 两道开关：每次都按名字精确确保 Pages 项目存在并打印地址；仓库变量 PAGES_DEPLOY=true 后才上传（未配 Access 即上传 = 公开）。
  # 串行发布、保留全部排队（queue: max），上传前核对本次提交仍是 main 最新，避免慢的旧运行或历史重跑把环境回退；
  # 上传前还会确认正式与预览地址都被 Cloudflare Access 拦截，否则拒绝上传。
  pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # queue: max 保留所有排队中的发布（默认只留一个、会挤掉排队中的最新发布）；先后顺序不保证，由 pages.sh 的 SHA 检查兜底
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _devloop
          sparse-checkout: scripts/devloop
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: vars.PAGES_DEPLOY == 'true'
        with:
          name: camp-empire-${{ github.sha }}
          path: dist
      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT || 'camp-empire' }}
          SHA: ${{ github.sha }}
          DEPLOY: ${{ vars.PAGES_DEPLOY }}
          DIST: ${{ github.workspace }}/dist
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash _devloop/scripts/devloop/pages.sh
