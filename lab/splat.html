<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camp-empire · 泼溅共存点验</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101410; color: #f4efe4; font: 14px/1.4 "PingFang SC", "Microsoft YaHei", sans-serif; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 2; max-width: min(440px, calc(100vw - 24px));
        background: rgba(16, 20, 16, 0.78); border: 1px solid rgba(244, 239, 228, 0.25); border-radius: 10px; padding: 10px 12px;
      }
      #hud h1 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
      #hud p { margin: 0 0 8px; color: #d9d0c0; }
      #readout { font-variant-numeric: tabular-nums; white-space: pre-wrap; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      button {
        font: inherit; color: inherit; background: #2a3328; border: 1px solid rgba(244, 239, 228, 0.3);
        border-radius: 8px; padding: 4px 8px; cursor: pointer;
      }
      button[aria-pressed="true"] { background: #6d5a32; }
      label { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      #status {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: rgba(16, 20, 16, 0.72);
        font-size: 18px;
      }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="泼溅背景与占位房车"></div>
    <aside id="hud">
      <h1>技术点验 · 未接入营地主流程</h1>
      <p>背景是 Spark 官方示例山谷泼溅，前景是现有占位房车。拖拽环绕，滚轮缩放。</p>
      <div id="readout">加载中</div>
      <div class="row">
        <button type="button" data-view="overview">俯瞰</button>
        <button type="button" data-view="front">车头</button>
        <button type="button" data-view="side">侧面</button>
        <button type="button" data-view="rear">车尾</button>
        <button type="button" data-view="low">低角度</button>
        <button type="button" data-view="bury">半埋特写</button>
        <button type="button" id="splat-toggle" aria-pressed="true">泼溅开</button>
      </div>
      <label>半埋 <input id="bury" type="range" min="0" max="1.5" step="0.05" value="0" /> <span id="bury-label">0 m</span></label>
    </aside>
    <div id="status" role="status">正在拉取泼溅…</div>
    <script type="module" src="/src/lab/splat.ts"></script>
  </body>
</html>
