<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camp-empire · 房车营地</title>
  </head>
  <body>
    <div id="stage" aria-label="营地场景"></div>
    <header class="top">
      <div class="brand">camp<span>·</span>empire</div>
      <div class="clock" id="clock"></div>
      <div class="wallet" title="金币"><span class="coin" id="coins">0</span></div>
      <button class="help" id="help" data-act="guide" title="快捷键引导（H）" aria-label="快捷键引导"></button>
    </header>
    <!-- 收起式控制面板：所有菜单收在底栏罗盘里，点罗盘展开圆形菜单，选中后打开抽屉（逻辑见 src/shared/hudnav.ts、src/client/hud.ts） -->
    <div id="sheet-backdrop" data-act="drawerClose" hidden></div>
    <aside class="panel left" id="drawer-left" hidden>
      <div class="sheet-head"><b class="sheet-title" id="drawer-left-title"></b><button class="sheet-close" data-act="drawerClose" aria-label="收起">完成</button></div>
      <section id="garage" data-tab="garage"></section>
      <section id="shop" data-tab="shop"></section>
    </aside>
    <aside class="panel right" id="drawer-right" hidden>
      <div class="sheet-head"><b class="sheet-title" id="drawer-right-title"></b><button class="sheet-close" data-act="drawerClose" aria-label="收起">完成</button></div>
      <section id="pending" data-tab="pending"></section>
      <section id="spots" data-tab="spots"></section>
      <section id="daily" data-tab="daily"></section>
      <section data-tab="log"><h2>流水</h2><ul id="log"></ul></section>
    </aside>
    <div id="radial" hidden></div>
    <div class="dock">
      <div id="views"></div>
      <div id="speed"></div>
      <div id="controls"></div>
      <div id="bump" hidden>碰到了！</div>
    </div>
    <div id="readonly" role="alert" hidden>
      <span id="readonly-msg">这个存档正在另一个标签页里玩，本页只读（只跟随显示）。</span>
      <button data-act="takeover">在这里玩</button>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="welcome" role="dialog" aria-label="回访" hidden></div>
    <div id="camp-card" role="dialog" aria-label="露营卡片" hidden>
      <img id="camp-card-img" alt="露营卡片预览" />
      <div class="row">
        <button class="primary" data-act="cardDownload">下载 PNG</button>
        <button data-act="cardCopy">复制图片</button>
        <button data-act="cardClose">关闭</button>
      </div>
    </div>
    <div id="guide" role="dialog" aria-modal="false" aria-label="快捷键引导" hidden></div>
    <div id="dex" role="dialog" aria-label="车型图鉴" hidden></div>
    <div id="privacy" role="dialog" aria-label="隐私与统计" hidden>
      <h2>隐私与统计</h2>
      <div id="privacy-body"></div>
      <div class="row">
        <button data-act="privacyToggle" id="privacy-toggle">关闭匿名统计</button>
        <button data-act="privacyClose">关闭</button>
      </div>
    </div>
    <div id="dev" hidden>
      <span>开发快进</span>
      <button data-act="dev" data-arg="3600000">+1 小时</button>
      <button data-act="dev" data-arg="43200000">+12 小时</button>
      <button data-act="dev" data-arg="86400000">+1 天</button>
      <button data-act="dev" data-arg="259200000">+3 天</button>
      <button data-act="dev" data-arg="reset">重开存档</button>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
